name: Deploy Angular a cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build -- --configuration production --base-href /

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.icmencuestasapp.com.co
          username: appftp@app.icmencuestasapp.com.co
          password: @Consultoria2026
          port: 21
          protocol: ftps
          local-dir: dist/encuestar/browser/
          server-dir: /public_html/
          dangerous-clean-slate: false
          log-level: standard
